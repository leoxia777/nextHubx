name: NextHubX Release

# Push a tag `vX.Y.Z` (must match package.json version, from main) to trigger.
# Builds macOS (aarch64 + x86_64/Intel) + Windows (x64 + arm64) → dmg/nsis + updater .sig →
# per-target latest.json → upload to Cloudflare R2 → publish GitHub Release.
#
# No OS code signing (same as Clash Verge): macOS is adhoc-signed, Windows is
# unsigned. Only the updater minisign key (TAURI_SIGNING_*) and R2 secrets are
# used; both are optional — if unset, .sig/R2 upload are skipped and the build
# still produces installable bundles (see docs/RELEASE.md).

on:
  push:
    tags:
      - 'v*.*.*' # 测试 channel(现网/存量,行为不变)
      - 'prod-v*.*.*' # 生产 channel(pgate/psub + pupdates,独立 R2 桶)

permissions:
  contents: write # create/update GitHub Releases

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  # ── 0. Tag ↔ package.json version consistency ────────────────────────────────
  check-version:
    name: Check tag matches package.json
    runs-on: ubuntu-latest
    # 派生 channel + semver 供 build/publish 消费(单一来源,两 job 同判)
    outputs:
      channel: ${{ steps.chan.outputs.channel }}
      version: ${{ steps.chan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # tag 前缀选 channel:prod-v* → 生产;v* → 测试(现网,行为不变)。
      # 剥掉 prod- 前缀后得到与 package.json 对齐的 semver tag。
      - name: Resolve channel + version from tag
        id: chan
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == prod-v* ]]; then
            CHANNEL=prod
            SEMVER_TAG="${TAG#prod-}"   # prod-v1.2.3 → v1.2.3
          else
            CHANNEL=test
            SEMVER_TAG="$TAG"           # v1.2.3
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=${SEMVER_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Channel=$CHANNEL, semver tag=$SEMVER_TAG"

      - name: Verify tag is reachable from main
        run: |
          TAG_REF="${GITHUB_REF_NAME}"
          if git merge-base --is-ancestor "$TAG_REF" origin/main; then
            echo "OK: tag $TAG_REF is on main."
          else
            echo "::error::Tag $TAG_REF is not reachable from origin/main. Release tags must come from main."
            exit 1
          fi

      - name: Verify tag == v<package.json version>
        env:
          SEMVER_TAG: v${{ steps.chan.outputs.version }}
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          EXPECTED="v$PKG_VERSION"
          if [[ "$SEMVER_TAG" != "$EXPECTED" ]]; then
            echo "::error::Version mismatch: tag(semver)=$SEMVER_TAG package.json=$EXPECTED"
            exit 1
          fi
          echo "OK: $SEMVER_TAG == $EXPECTED (channel=${{ steps.chan.outputs.channel }})"

  # ── 1. Build + sign + create a draft GitHub Release with bundles + .sig ───────
  build:
    name: Build (${{ matrix.label }})
    needs: [check-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-aarch64
          # x86_64 用原生 Intel runner(macos-13)构建,而非在 ARM(macos-latest)上交叉编译:
          # macos-latest 镜像已移除 /usr/local 下的 Intel Homebrew,交叉编译的 OpenSSL 步骤会
          # 回退到 Rosetta 跑 ARM brew 而被拒(Cannot install under Rosetta 2 in ARM prefix)。
          # 原生 Intel 无需交叉编译 OpenSSL。(macos-13 将来 EOL 时改用 vendored openssl。)
          - os: macos-13
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            label: Windows-ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust'
          key: 'release-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: '. -> target'

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # macOS runner 现为 Apple Silicon;构建 x86_64-apple-darwin = 交叉编译,
      # 需 x86_64 版 OpenSSL(沿用 CVR autobuild 配方)。aarch64 原生构建不需要。
      - name: Install x86_64 OpenSSL (macOS Intel cross-build only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          arch -x86_64 /usr/local/bin/brew install openssl@3 2>/dev/null || arch -x86_64 brew install openssl@3
          PREFIX=$(arch -x86_64 brew --prefix openssl@3)
          echo "OPENSSL_DIR=$PREFIX" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$PREFIX/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install deps + prebuild sidecars
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      # 生产 channel:把烤进二进制的 updater endpoint 指向 pupdates(独立 R2 桶)。
      # 测试 channel 保持 tauri.conf.json 里的默认 updates.nexthubx.io,不动。
      - name: Point updater endpoint to prod channel
        if: needs.check-version.outputs.channel == 'prod'
        shell: bash
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';let s=fs.readFileSync(f,'utf8');const from='https://updates.nexthubx.io/{{target}}-{{arch}}/latest.json';const to='https://pupdates.nexthubx.io/{{target}}-{{arch}}/latest.json';if(!s.includes(from)){console.error('::error::updater endpoint default not found — cannot repoint to prod');process.exit(1);}fs.writeFileSync(f,s.split(from).join(to));const now=require('./'+f).plugins.updater.endpoints;if(!now.every(e=>e.includes('pupdates.nexthubx.io'))){console.error('::error::endpoint repoint failed',now);process.exit(1);}console.log('updater endpoint → pupdates.nexthubx.io:',now);"

      - name: Tauri build (dmg/nsis + updater .sig, unsigned binaries)
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── 业务 API base(Vite 编译期烤进前端)。prod → pgate;测试/默认 → 空
          #    (客户端回退 gate.nexthubx.io,现网行为不变)。Vite 从进程环境读 VITE_*。
          VITE_NEXTHUBX_API_BASE: ${{ needs.check-version.outputs.channel == 'prod' && 'https://pgate.nexthubx.io' || '' }}
          # ── Updater signing (minisign). From nexthubx-updater.key — see docs/RELEASE.md.
          #    Independent of OS code signing. If unset, .sig is not produced and
          #    auto-update won't verify; build still succeeds.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── No OS code signing: macOS ships adhoc-signed, Windows ships unsigned
          #    (same as Clash Verge). Users bypass Gatekeeper/SmartScreen on first
          #    launch — see docs/RELEASE.md. updater minisign above is unaffected.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NextHubX ${{ github.ref_name }}'
          releaseBody: 'NextHubX ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          tauriScript: pnpm
          args: --target ${{ matrix.target }}
          # We build latest.json ourselves (per-target) in the publish job, so the
          # built-in single update.json from tauri-action is not needed.
          includeUpdaterJson: false

  # ── 2. Generate per-target latest.json, push to R2, publish the Release ───────
  publish:
    name: Publish Release + latest.json
    needs: [check-version, build]
    runs-on: ubuntu-latest
    env:
      # Map presence of R2 secrets to a plain env flag — `secrets.*` is not
      # reliably usable inside step-level `if:`, so we gate on this instead.
      # prod 用独立桶 + 独立 S3 凭证(R2_*_PROD);test 用现网凭证。两者共用账号级 R2_ENDPOINT。
      R2_CONFIGURED: ${{ secrets.R2_ENDPOINT != '' && ( (needs.check-version.outputs.channel == 'prod' && secrets.R2_ACCESS_KEY_ID_PROD != '' && secrets.R2_BUCKET_PROD != '') || (needs.check-version.outputs.channel != 'prod' && secrets.R2_ACCESS_KEY_ID != '') ) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Resolve version + tag
        id: meta
        run: |
          # tag = 实际 git tag(prod-v* 或 v*),用于 gh release / 下载 URL。
          # version = 已剥 prod-v/v 前缀的纯 semver(latest.json 版本比对用)。
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.check-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "channel=${{ needs.check-version.outputs.channel }}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Build latest.json per Tauri updater target key from the draft release assets:
      #   darwin-aarch64  ← *aarch64.app.tar.gz (+ .sig)
      #   windows-x86_64  ← *x64-setup.exe      (+ .sig)
      # Endpoint shape in tauri.conf.json: /{{target}}-{{arch}}/latest.json
      #   → darwin-aarch64/latest.json , windows-x86_64/latest.json
      - name: Generate per-target latest.json
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p out
          # asset name → browser_download_url map for this tag's (draft) release
          gh release view "$TAG" --json assets \
            --jq '.assets[] | [.name, .url] | @tsv' > assets.tsv || {
              echo "::warning::No release assets found for $TAG; latest.json will be empty.";
              : > assets.tsv;
            }

          fetch_sig() { # $1 = .sig asset name → echo signature content (empty if missing)
            local url
            url=$(awk -F'\t' -v n="$1" '$1==n{print $2}' assets.tsv)
            [ -z "$url" ] && { echo ""; return; }
            gh release download "$TAG" --pattern "$1" --output - 2>/dev/null || echo ""
          }
          # 用 tag 固定下载地址(un-draft 后有效);不可用 draft 的 untagged url(会 404)
          url_of() { echo "https://github.com/leoxia777/nextHubx/releases/download/${TAG}/$1"; }

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES="NextHubX $TAG"

          # ---- darwin-aarch64 ----
          DARWIN_BUNDLE=$(awk -F'\t' '$1 ~ /aarch64\.app\.tar\.gz$/{print $1; exit}' assets.tsv)
          if [ -n "$DARWIN_BUNDLE" ]; then
            DARWIN_URL=$(url_of "$DARWIN_BUNDLE")
            DARWIN_SIG=$(fetch_sig "${DARWIN_BUNDLE}.sig")
            mkdir -p out/darwin-aarch64
            jq -n --arg v "$VERSION" --arg n "$NOTES" --arg d "$PUB_DATE" \
                  --arg url "$DARWIN_URL" --arg sig "$DARWIN_SIG" \
              '{version:$v, notes:$n, pub_date:$d,
                platforms:{ "darwin-aarch64": { signature:$sig, url:$url } }}' \
              > out/darwin-aarch64/latest.json
            echo "wrote out/darwin-aarch64/latest.json"
          else
            echo "::warning::no darwin aarch64 .app.tar.gz found"
          fi

          # ---- windows-x86_64 ----
          WIN_BUNDLE=$(awk -F'\t' '$1 ~ /x64-setup\.exe$/{print $1; exit}' assets.tsv)
          if [ -n "$WIN_BUNDLE" ]; then
            WIN_URL=$(url_of "$WIN_BUNDLE")
            WIN_SIG=$(fetch_sig "${WIN_BUNDLE}.sig")
            mkdir -p out/windows-x86_64
            jq -n --arg v "$VERSION" --arg n "$NOTES" --arg d "$PUB_DATE" \
                  --arg url "$WIN_URL" --arg sig "$WIN_SIG" \
              '{version:$v, notes:$n, pub_date:$d,
                platforms:{ "windows-x86_64": { signature:$sig, url:$url } }}' \
              > out/windows-x86_64/latest.json
            echo "wrote out/windows-x86_64/latest.json"
          else
            echo "::warning::no windows x64 setup.exe found"
          fi

          # ---- darwin-x86_64 (Intel Mac) ----
          MACX_BUNDLE=$(awk -F'\t' '$1 ~ /(x64|x86_64)\.app\.tar\.gz$/{print $1; exit}' assets.tsv)
          if [ -n "$MACX_BUNDLE" ]; then
            MACX_URL=$(url_of "$MACX_BUNDLE")
            MACX_SIG=$(fetch_sig "${MACX_BUNDLE}.sig")
            mkdir -p out/darwin-x86_64
            jq -n --arg v "$VERSION" --arg n "$NOTES" --arg d "$PUB_DATE" \
                  --arg url "$MACX_URL" --arg sig "$MACX_SIG" \
              '{version:$v, notes:$n, pub_date:$d,
                platforms:{ "darwin-x86_64": { signature:$sig, url:$url } }}' \
              > out/darwin-x86_64/latest.json
            echo "wrote out/darwin-x86_64/latest.json"
          else
            echo "::warning::no darwin x86_64 .app.tar.gz found"
          fi

          # ---- windows-aarch64 (ARM64) ----
          WINARM_BUNDLE=$(awk -F'\t' '$1 ~ /arm64-setup\.exe$/{print $1; exit}' assets.tsv)
          if [ -n "$WINARM_BUNDLE" ]; then
            WINARM_URL=$(url_of "$WINARM_BUNDLE")
            WINARM_SIG=$(fetch_sig "${WINARM_BUNDLE}.sig")
            mkdir -p out/windows-aarch64
            jq -n --arg v "$VERSION" --arg n "$NOTES" --arg d "$PUB_DATE" \
                  --arg url "$WINARM_URL" --arg sig "$WINARM_SIG" \
              '{version:$v, notes:$n, pub_date:$d,
                platforms:{ "windows-aarch64": { signature:$sig, url:$url } }}' \
              > out/windows-aarch64/latest.json
            echo "wrote out/windows-aarch64/latest.json"
          else
            echo "::warning::no windows arm64 setup.exe found"
          fi

          find out -type f -print

      - name: Upload latest.json artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: out/**/latest.json
          if-no-files-found: warn

      # R2 is an S3-compatible bucket. Endpoint/keys are placeholders — step is
      # skipped (no error) until the four R2_* secrets are configured.
      - name: Upload latest.json to Cloudflare R2
        # 仅正式版推 R2(生产分发 + updater 通道);预发(-rc)只构建+建 GitHub 预发布,不碰线上
        if: ${{ env.R2_CONFIGURED == 'true' && steps.meta.outputs.prerelease == 'false' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.meta.outputs.channel == 'prod' && secrets.R2_ACCESS_KEY_ID_PROD || secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.meta.outputs.channel == 'prod' && secrets.R2_SECRET_ACCESS_KEY_PROD || secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ steps.meta.outputs.channel == 'prod' && secrets.R2_BUCKET_PROD || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # aws-cli is preinstalled on ubuntu-latest runners.
          aws s3 cp out/ "s3://${R2_BUCKET}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control 'no-cache'
          echo "Uploaded latest.json files to R2 bucket $R2_BUCKET."

      # 安装包(dmg/exe)也传 R2,供 download.nexthubx.com 下载页直链(国内首次下载提速):
      #   download/<tag>/<原名>       —— 版本归档,地址含版本号 → immutable 长缓存
      #   download/latest/NextHubX-*  —— 固定直链,每版覆盖 → no-cache,下载页/分发用
      # 注:自动升级仍走 latest.json 的版本化 url(签名匹配),与此处直链互不影响。
      - name: Upload installers to R2 (download/ + latest/)
        # 仅正式版推 R2(生产分发 + updater 通道);预发(-rc)只构建+建 GitHub 预发布,不碰线上
        if: ${{ env.R2_CONFIGURED == 'true' && steps.meta.outputs.prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ steps.meta.outputs.channel == 'prod' && secrets.R2_ACCESS_KEY_ID_PROD || secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.meta.outputs.channel == 'prod' && secrets.R2_SECRET_ACCESS_KEY_PROD || secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ steps.meta.outputs.channel == 'prod' && secrets.R2_BUCKET_PROD || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p inst
          gh release download "$TAG" --dir inst --pattern '*.dmg' --pattern '*-setup.exe' || true
          put() { # $1 local  $2 r2-key  $3 content-type  $4 cache-control
            aws s3 cp "$1" "s3://${R2_BUCKET}/$2" --endpoint-url "$R2_ENDPOINT" \
              --content-type "$3" --cache-control "$4"
          }
          DMG='application/x-apple-diskimage'; EXE='application/vnd.microsoft.portable-executable'
          IMM='public, max-age=31536000, immutable'
          # 按架构子串归类(产物名沿 CVR 约定:_aarch64.dmg / _x64.dmg / _x64-setup.exe / _arm64-setup.exe)
          MAC_ARM=$(ls inst/*aarch64*.dmg 2>/dev/null | head -1)
          MAC_X64=$(ls inst/*_x64.dmg 2>/dev/null | head -1)
          WIN_X64=$(ls inst/*x64-setup.exe 2>/dev/null | head -1)
          WIN_ARM=$(ls inst/*arm64-setup.exe 2>/dev/null | head -1)
          arch_put() { # $1 local  $2 latest 固定名  $3 ctype
            [ -z "$1" ] && { echo "::warning::missing installer for $2"; return; }
            put "$1" "download/${TAG}/$(basename "$1")" "$3" "$IMM"   # 版本化归档
            put "$1" "download/latest/$2" "$3" 'no-cache'             # 架构固定直链
          }
          arch_put "$MAC_ARM" "NextHubX-mac-aarch64.dmg" "$DMG"
          arch_put "$MAC_X64" "NextHubX-mac-x64.dmg"   "$DMG"
          arch_put "$WIN_X64" "NextHubX-win-x64.exe"   "$EXE"
          arch_put "$WIN_ARM" "NextHubX-win-arm64.exe" "$EXE"
          # 向后兼容旧固定名(指向主流架构:mac→aarch64, win→x64)
          [ -n "$MAC_ARM" ] && put "$MAC_ARM" "download/latest/NextHubX-mac.dmg" "$DMG" 'no-cache'
          [ -n "$WIN_X64" ] && put "$WIN_X64" "download/latest/NextHubX-win.exe" "$EXE" 'no-cache'
          echo "Installers synced to R2: download/${TAG}/ + download/latest/ (4 arch)"

      - name: Skipped R2 upload (secrets not set)
        if: ${{ env.R2_CONFIGURED != 'true' }}
        run: echo "::notice::R2_* secrets not configured — skipping R2 upload. See docs/RELEASE.md."

      - name: Publish the GitHub Release (un-draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          gh release edit "$TAG" \
            --draft=false \
            --prerelease="$PRERELEASE" \
            --title "NextHubX $TAG"
          echo "Published release $TAG."
