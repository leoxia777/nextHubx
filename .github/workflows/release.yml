name: NextHubX Release

# Push a tag `vX.Y.Z` (must match package.json version, from main) to trigger.
# Builds macOS (aarch64) + Windows (x64) → dmg/nsis + updater .sig →
# per-target latest.json → upload to Cloudflare R2 → publish GitHub Release.
#
# No OS code signing (same as Clash Verge): macOS is adhoc-signed, Windows is
# unsigned. Only the updater minisign key (TAURI_SIGNING_*) and R2 secrets are
# used; both are optional — if unset, .sig/R2 upload are skipped and the build
# still produces installable bundles (see docs/RELEASE.md).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create/update GitHub Releases

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  # ── 0. Tag ↔ package.json version consistency ────────────────────────────────
  check-version:
    name: Check tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        run: |
          TAG_REF="${GITHUB_REF_NAME}"
          if git merge-base --is-ancestor "$TAG_REF" origin/main; then
            echo "OK: tag $TAG_REF is on main."
          else
            echo "::error::Tag $TAG_REF is not reachable from origin/main. Release tags must come from main."
            exit 1
          fi

      - name: Verify tag == v<package.json version>
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          EXPECTED="v$PKG_VERSION"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED" ]]; then
            echo "::error::Version mismatch: tag=$GITHUB_REF_NAME package.json=$EXPECTED"
            exit 1
          fi
          echo "OK: $GITHUB_REF_NAME == $EXPECTED"

  # ── 1. Build + sign + create a draft GitHub Release with bundles + .sig ───────
  build:
    name: Build (${{ matrix.label }})
    needs: [check-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust'
          key: 'release-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: '. -> target'

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install deps + prebuild sidecars
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Tauri build (dmg/nsis + updater .sig, unsigned binaries)
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Updater signing (minisign). From nexthubx-updater.key — see docs/RELEASE.md.
          #    Independent of OS code signing. If unset, .sig is not produced and
          #    auto-update won't verify; build still succeeds.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── No OS code signing: macOS ships adhoc-signed, Windows ships unsigned
          #    (same as Clash Verge). Users bypass Gatekeeper/SmartScreen on first
          #    launch — see docs/RELEASE.md. updater minisign above is unaffected.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NextHubX ${{ github.ref_name }}'
          releaseBody: 'NextHubX ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          tauriScript: pnpm
          args: --target ${{ matrix.target }}
          # We build latest.json ourselves (per-target) in the publish job, so the
          # built-in single update.json from tauri-action is not needed.
          includeUpdaterJson: false

  # ── 2. Generate per-target latest.json, push to R2, publish the Release ───────
  publish:
    name: Publish Release + latest.json
    needs: [build]
    runs-on: ubuntu-latest
    env:
      # Map presence of R2 secrets to a plain env flag — `secrets.*` is not
      # reliably usable inside step-level `if:`, so we gate on this instead.
      R2_CONFIGURED: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Resolve version + tag
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Build latest.json per Tauri updater target key from the draft release assets:
      #   darwin-aarch64  ← *aarch64.app.tar.gz (+ .sig)
      #   windows-x86_64  ← *x64-setup.exe      (+ .sig)
      # Endpoint shape in tauri.conf.json: /{{target}}-{{arch}}/latest.json
      #   → darwin-aarch64/latest.json , windows-x86_64/latest.json
      - name: Generate per-target latest.json
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p out
          # asset name → browser_download_url map for this tag's (draft) release
          gh release view "$TAG" --json assets \
            --jq '.assets[] | [.name, .url] | @tsv' > assets.tsv || {
              echo "::warning::No release assets found for $TAG; latest.json will be empty.";
              : > assets.tsv;
            }

          fetch_sig() { # $1 = .sig asset name → echo signature content (empty if missing)
            local url
            url=$(awk -F'\t' -v n="$1" '$1==n{print $2}' assets.tsv)
            [ -z "$url" ] && { echo ""; return; }
            gh release download "$TAG" --pattern "$1" --output - 2>/dev/null || echo ""
          }
          # 用 tag 固定下载地址(un-draft 后有效);不可用 draft 的 untagged url(会 404)
          url_of() { echo "https://github.com/leoxia777/nextHubx/releases/download/${TAG}/$1"; }

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES="NextHubX $TAG"

          # ---- darwin-aarch64 ----
          DARWIN_BUNDLE=$(awk -F'\t' '$1 ~ /aarch64\.app\.tar\.gz$/{print $1; exit}' assets.tsv)
          if [ -n "$DARWIN_BUNDLE" ]; then
            DARWIN_URL=$(url_of "$DARWIN_BUNDLE")
            DARWIN_SIG=$(fetch_sig "${DARWIN_BUNDLE}.sig")
            mkdir -p out/darwin-aarch64
            jq -n --arg v "$VERSION" --arg n "$NOTES" --arg d "$PUB_DATE" \
                  --arg url "$DARWIN_URL" --arg sig "$DARWIN_SIG" \
              '{version:$v, notes:$n, pub_date:$d,
                platforms:{ "darwin-aarch64": { signature:$sig, url:$url } }}' \
              > out/darwin-aarch64/latest.json
            echo "wrote out/darwin-aarch64/latest.json"
          else
            echo "::warning::no darwin aarch64 .app.tar.gz found"
          fi

          # ---- windows-x86_64 ----
          WIN_BUNDLE=$(awk -F'\t' '$1 ~ /x64-setup\.exe$/{print $1; exit}' assets.tsv)
          if [ -n "$WIN_BUNDLE" ]; then
            WIN_URL=$(url_of "$WIN_BUNDLE")
            WIN_SIG=$(fetch_sig "${WIN_BUNDLE}.sig")
            mkdir -p out/windows-x86_64
            jq -n --arg v "$VERSION" --arg n "$NOTES" --arg d "$PUB_DATE" \
                  --arg url "$WIN_URL" --arg sig "$WIN_SIG" \
              '{version:$v, notes:$n, pub_date:$d,
                platforms:{ "windows-x86_64": { signature:$sig, url:$url } }}' \
              > out/windows-x86_64/latest.json
            echo "wrote out/windows-x86_64/latest.json"
          else
            echo "::warning::no windows x64 setup.exe found"
          fi

          find out -type f -print

      - name: Upload latest.json artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: out/**/latest.json
          if-no-files-found: warn

      # R2 is an S3-compatible bucket. Endpoint/keys are placeholders — step is
      # skipped (no error) until the four R2_* secrets are configured.
      - name: Upload latest.json to Cloudflare R2
        if: ${{ env.R2_CONFIGURED == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # aws-cli is preinstalled on ubuntu-latest runners.
          aws s3 cp out/ "s3://${R2_BUCKET}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control 'no-cache'
          echo "Uploaded latest.json files to R2 bucket $R2_BUCKET."

      - name: Skipped R2 upload (secrets not set)
        if: ${{ env.R2_CONFIGURED != 'true' }}
        run: echo "::notice::R2_* secrets not configured — skipping R2 upload. See docs/RELEASE.md."

      - name: Publish the GitHub Release (un-draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          gh release edit "$TAG" \
            --draft=false \
            --prerelease="$PRERELEASE" \
            --title "NextHubX $TAG"
          echo "Published release $TAG."
