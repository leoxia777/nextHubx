name: Sync installers to R2

# 手动把某个已发布 Release 的安装包(dmg/exe)同步到 Cloudflare R2 的 download/ 路径,
# 供 download.nexthubx.com 下载页直链。用于补传历史版本(release.yml 上线前发的版本,
# 如 v0.1.1),或单独重刷某版。日常新版由 release.yml 自动完成,无需手动跑此 workflow。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read # download release assets of this repo

jobs:
  sync:
    name: Sync ${{ inputs.tag }} installers → R2
    runs-on: ubuntu-latest
    env:
      R2_CONFIGURED: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_ENDPOINT != '' }}
    steps:
      - name: Guard — R2 secrets must be configured
        if: ${{ env.R2_CONFIGURED != 'true' }}
        run: |
          echo "::error::R2_* secrets not configured — cannot sync. See docs/RELEASE.md."
          exit 1

      - name: Download installers + upload to R2 (download/ + latest/)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p inst
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir inst \
            --pattern '*.dmg' --pattern '*x64-setup.exe'
          MAC=$(ls inst/*.dmg 2>/dev/null | head -1)
          WIN=$(ls inst/*x64-setup.exe 2>/dev/null | head -1)
          put() { # $1 local  $2 r2-key  $3 content-type  $4 cache-control
            aws s3 cp "$1" "s3://${R2_BUCKET}/$2" --endpoint-url "$R2_ENDPOINT" \
              --content-type "$3" --cache-control "$4"
          }
          if [ -n "$MAC" ]; then
            put "$MAC" "download/${TAG}/$(basename "$MAC")" application/x-apple-diskimage 'public, max-age=31536000, immutable'
            put "$MAC" "download/latest/NextHubX-mac.dmg" application/x-apple-diskimage 'no-cache'
          else echo "::warning::no .dmg asset for $TAG"; fi
          if [ -n "$WIN" ]; then
            put "$WIN" "download/${TAG}/$(basename "$WIN")" application/vnd.microsoft.portable-executable 'public, max-age=31536000, immutable'
            put "$WIN" "download/latest/NextHubX-win.exe" application/vnd.microsoft.portable-executable 'no-cache'
          else echo "::warning::no x64-setup.exe asset for $TAG"; fi
          echo "Synced $TAG installers to R2: download/${TAG}/ + download/latest/"
