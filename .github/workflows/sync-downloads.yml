name: Sync installers to R2

# 手动把某个已发布 Release 的安装包(dmg/exe)同步到 Cloudflare R2 的 download/ 路径,
# 供 download.nexthubx.com 下载页直链。用于补传历史版本(release.yml 上线前发的版本,
# 如 v0.1.1),或单独重刷某版。日常新版由 release.yml 自动完成,无需手动跑此 workflow。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read # download release assets of this repo

jobs:
  sync:
    name: Sync ${{ inputs.tag }} installers → R2
    runs-on: ubuntu-latest
    env:
      R2_CONFIGURED: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_ENDPOINT != '' }}
    steps:
      - name: Guard — R2 secrets must be configured
        if: ${{ env.R2_CONFIGURED != 'true' }}
        run: |
          echo "::error::R2_* secrets not configured — cannot sync. See docs/RELEASE.md."
          exit 1

      - name: Download installers + upload to R2 (download/ + latest/)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p inst
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir inst \
            --pattern '*.dmg' --pattern '*-setup.exe'
          put() { # $1 local  $2 r2-key  $3 content-type  $4 cache-control
            aws s3 cp "$1" "s3://${R2_BUCKET}/$2" --endpoint-url "$R2_ENDPOINT" \
              --content-type "$3" --cache-control "$4"
          }
          DMG='application/x-apple-diskimage'; EXE='application/vnd.microsoft.portable-executable'
          IMM='public, max-age=31536000, immutable'
          MAC_ARM=$(ls inst/*aarch64*.dmg 2>/dev/null | head -1)
          MAC_X64=$(ls inst/*_x64.dmg 2>/dev/null | head -1)
          WIN_X64=$(ls inst/*x64-setup.exe 2>/dev/null | head -1)
          WIN_ARM=$(ls inst/*arm64-setup.exe 2>/dev/null | head -1)
          arch_put() { # $1 local  $2 latest 固定名  $3 ctype
            [ -z "$1" ] && { echo "::warning::missing installer for $2"; return; }
            put "$1" "download/${TAG}/$(basename "$1")" "$3" "$IMM"
            put "$1" "download/latest/$2" "$3" 'no-cache'
          }
          arch_put "$MAC_ARM" "NextHubX-mac-aarch64.dmg" "$DMG"
          arch_put "$MAC_X64" "NextHubX-mac-x64.dmg"   "$DMG"
          arch_put "$WIN_X64" "NextHubX-win-x64.exe"   "$EXE"
          arch_put "$WIN_ARM" "NextHubX-win-arm64.exe" "$EXE"
          [ -n "$MAC_ARM" ] && put "$MAC_ARM" "download/latest/NextHubX-mac.dmg" "$DMG" 'no-cache'
          [ -n "$WIN_X64" ] && put "$WIN_X64" "download/latest/NextHubX-win.exe" "$EXE" 'no-cache'
          echo "Synced $TAG installers to R2: download/${TAG}/ + download/latest/ (4 arch)"
